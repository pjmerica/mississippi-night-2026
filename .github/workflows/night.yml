name: Mississippi live

# night.py every 30 s: NYT's count, the county projector from our margin model, Kalshi/Polymarket books and edges,
# written to live.json on the orphan branch `live` (one commit, amended and force-pushed). index.html reads it.
# Start: gh workflow run night.yml   Stop: gh run cancel <id>

# A job runs ~5h40m (GitHub stops jobs at 6h), then dispatches the next, which starts when it ends. The cron is the
# backstop if a job dies. Stops after Dec 14: the late count (user 2026-11-04: "keep recording those votes").
on:
  schedule:
    - cron: '17,47 * * 11 *'
    - cron: '17,47 * 1-14 12 *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'job length, minutes'
        default: '340'

concurrency:
  group: live
  cancel-in-progress: false      # the backstop cron must never cancel a running job

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Check out the live branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" live >/dev/null; then
            git clone -q --depth 1 --branch live "$url" state
          else
            git init -q -b live state
            git -C state remote add origin "$url"
          fi
          git -C state config user.name "mississippi-live"
          git -C state config user.email "actions@users.noreply.github.com"
      - run: date -u +%s > started
      - run: python night.py --minutes "${{ inputs.minutes || 340 }}" --state state
      # Only after a full-length job: one that dies in its first minutes must not dispatch itself in a tight loop.
      - name: Dispatch the next job
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ran=$(( $(date -u +%s) - $(cat started) ))
          if [ "$ran" -gt 1200 ] && [ "$(date -u +%s)" -lt "$(date -u -d 2026-12-15T05:00:00Z +%s)" ]; then
            gh workflow run night.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "dispatched the next job after ${ran}s"
          else
            echo "not dispatching (ran ${ran}s)"
          fi
