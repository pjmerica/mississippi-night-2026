<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mississippi election night 2026: counties vs our model</title>
<style>
:root {
  --bg: #0c1016; --panel: #131922; --panel2: #18202b; --line: #232c39; --line2: #2f3a4a;
  --text: #e7ebf1; --muted: #8e99aa; --faint: #5d687a; --dem: #4a90e8; --rep: #e8665f;
  --mono: "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
  --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.42 var(--sans); font-variant-numeric: tabular-nums; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
h1 { font-size: 18px; margin: 0; }
.chips { display: flex; gap: 6px; }
button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
button[aria-pressed="true"] { background: #2a3550; border-color: #5a6a8a; }
.spacer { flex: 1; }
.note { color: var(--muted); font-size: 12.5px; }
.status { font: 12px var(--mono); color: var(--muted); }
.status b { color: var(--text); font-weight: 500; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 10px; padding: 10px 16px 16px; }
#deckmap { position: relative; height: calc(100vh - 150px); min-height: 520px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #151c27, #0a0d12); }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-y: auto; max-height: calc(100vh - 150px); min-height: 520px; font-size: 12.5px; display: grid; gap: 10px; align-content: start; }
aside h3 { margin: 0; font-size: 15px; }
aside h4 { margin: 4px 0 0; font-size: 13.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.kv span { color: var(--muted); }
.kv b { font-family: var(--mono); font-size: 12.5px; font-weight: 500; text-align: right; }
.pos { color: var(--dem) !important; } .neg { color: var(--rep) !important; }
.cbar { height: 6px; background: #2a3342; border-radius: 3px; overflow: hidden; margin: 2px 0 4px; }
.cbar i { display: block; height: 100%; background: #c9d1dc; }
table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
th { color: var(--faint); font-weight: 500; text-align: right; padding: 2px 3px; border-bottom: 1px solid var(--line); }
td { font-family: var(--mono); text-align: right; padding: 2px 3px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; font-family: var(--sans); }
tbody tr:hover td { background: #1a2230; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding: 0 16px 14px; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.ctip { font: 12.5px/1.45 var(--sans); }
.ctip h5 { margin: 0; font-size: 14px; }
.ctip .sub { color: var(--muted); margin-bottom: 5px; }
.ctip .kv .gap { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 3px 0 1px; }
.ctip .fine { color: var(--faint); margin-top: 5px; font-size: 11.5px; }
.err { color: #f0b35a; }
.proj { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
.big { display: flex; gap: 8px; }
.big div { flex: 1; background: #10151d; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.big small { display: block; color: var(--muted); font-size: 11.5px; }
.big b { font: 600 20px var(--mono); }
.flip { background: #3b2a10; border: 1px solid #a8741f; color: #f3c46b; border-radius: 6px; padding: 6px 8px; font-weight: 600; }
.best td { background: #17283d; }
.wchart { width: 100%; height: auto; display: block; }
.wchart text { fill: var(--faint); font: 10px var(--sans); }
.ctitle { color: var(--muted); font-size: 12px; margin: 2px 0 -4px; }
.clegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.clegend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
#ctip { position: fixed; pointer-events: none; z-index: 20; background: #131922; border: 1px solid #2f3a4a; border-radius: 6px; padding: 7px 9px; font: 12px/1.45 var(--sans); width: 290px; }
#ctip[hidden] { display: none; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } aside { max-height: none; } }
</style>
</head>
<body>
<header>
  <h1>Mississippi · counties vs our model</h1>
  <div class="chips" id="races"></div>
  <label class="note" for="metric">Columns</label>
  <select id="metric">
    <option value="net">Net votes vs expected</option>
    <option value="pts">Points over/under</option>
    <option value="left">Votes still out</option>
  </select>
  <div class="spacer"></div>
  <div class="status" id="status">loading…</div>
</header>
<main>
  <div id="deckmap" aria-label="3D map of Mississippi counties: over/under against our model"></div>
  <aside id="side"></aside>
</main>
<div class="legend" id="legend"></div>
<div id="ctip" class="ctip" hidden></div>
<script src="ms_bench.js"></script>
<script src="ms_geo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@8.9.35/dist.min.js"></script>
<script>
"use strict";
/* Mississippi only, separate from the data desk. The count comes straight from NYT's Mississippi page (results-mississippi.json,
   CORS open) every 60 s; the benchmarks (ms_bench.js, build.py) use the desk's method: each county's lean from the
   2024 presidential race and the seat's comparable race, shifted uniformly so the state lands on the margin
   model's 2026 margin. Over/under = the county's counted two-party Democratic share minus that expectation. */
const NYT = "https://static01.nyt.com/elections-assets/pages/data/2026-11-03/results-mississippi.json";
const C_D = [74, 144, 232], C_R = [232, 102, 95], OU_FULL = 10, TWO = 0.97, KEY_N = 15;
const B = window.MS_BENCH, G = window.MS_GEO;
const ui = { race: "sen", metric: "net", hl: null };
// Projection + Kalshi/Polymarket: live.json on the branch `live`, written every 30 s by night.py in GitHub Actions
// (Kalshi refuses cross-site browser requests). raw.githubusercontent first; GitHub's API (60 an hour) when raw's
// copy is over 90 s old, at most every 100 s. Never steps back to an older pass.
const LJ_RAW = "https://raw.githubusercontent.com/pjmerica/mississippi-night-2026/live/live.json";
const LJ_API = "https://api.github.com/repos/pjmerica/mississippi-night-2026/contents/live.json?ref=live";
let LJ = null, ljApiAt = 0, ljApiOff = 0;
const C_K = "#e2b84f";
let LIVE = null, DECK = null, FIT = null, fetchedAt = null, lastErr = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtInt = n => Math.round(n).toLocaleString("en-US");
const last = s => String(s).split(" ").slice(-1)[0];
const expit = x => 1 / (1 + Math.exp(-x)), logit = p => Math.log(p / (1 - p));
const etTime = d => d.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit", second: "2-digit" }) + " ET";

function parse(d) {
  const out = {};
  for (const [key, cfg] of Object.entries(B)) {
    const r = d.races.find(x => x.office === cfg.office && x.race_type_id === "G") || d.races.find(x => x.office === cfg.office);
    if (!r) continue;
    const pty = Object.fromEntries(Object.entries(r.candidate_metadata).map(([k, v]) => [k, v.party.nyt_id]));
    const units = {};
    let st = null;
    for (const u of r.reporting_units) {
      let dv = 0, rv = 0, tot = 0;
      for (const c of u.candidates) { const v = (c.votes || {}).total || 0; tot += v; if (pty[c.nyt_id] === "DEM") dv += v; else if (pty[c.nyt_id] === "GOP") rv += v; }
      const rec = { dv, rv, tot, exp: u.total_expected_vote || 0, eevp: u.eevp || 0 };
      if (u.level === "state") st = rec;
      else if (u.level === "county") units["28" + String(u.fips_county).padStart(3, "0")] = rec;
    }
    out[key] = { st, units, updated: r.updated_at };
  }
  return out;
}

function rows(key) {
  const cfg = B[key], lv = LIVE && LIVE[key];
  return cfg.counties.map(c => {
    const u = lv && lv.units[c.f] || { dv: 0, rv: 0, tot: 0, exp: 0, eevp: 0 };
    const two = u.dv + u.rv, share = two >= 50 ? u.dv / two : null;
    const expected = Math.max(u.exp || c.vt, u.tot);
    return { ...c, dv: u.dv, rv: u.rv, votes: u.tot, pct: u.eevp || (expected ? 100 * u.tot / expected : 0),
      share, dev: share != null ? 100 * (share - c.exp) : null,
      net: share != null ? (u.dv - u.rv) - (2 * c.exp - 1) * two : null,
      left: Math.max(expected - u.tot, 0), nexp: u.exp || null };
  });
}

function summary(key, rs) {
  const cfg = B[key], st = LIVE && LIVE[key] && LIVE[key].st;
  let num = 0, den = 0, net = 0;
  for (const c of rs) if (c.share != null) {
    const v = c.dv + c.rv;
    num += v * (logit(Math.min(Math.max(c.share, 1e-4), 1 - 1e-4)) - c.L); den += v; net += c.net;
  }
  const s = den ? num / den : null;      // the uniform shift the counted counties point to (desk's count-only shift)
  const implied = s == null ? null : 100 * TWO * (2 * rs.reduce((a, c) => a + c.w * expit(c.L + s), 0) - 1);
  return { st, implied, net, n: rs.filter(c => c.share != null).length, done: rs.filter(c => c.pct >= 95).length };
}

function lead(m, cfg) { return m == null ? "–" : Math.abs(m) < 0.05 ? "tied" : `${m > 0 ? last(cfg.model.d) : last(cfg.model.r)} +${Math.abs(m).toFixed(1)}`; }
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";

function tipHtml(c, cfg) {
  const pc = v => v == null ? "–" : (100 * v).toFixed(1) + "%";
  const dn = last(cfg.model.d), rn = last(cfg.model.r);
  let h = `<h5>${esc(c.n)}</h5><div class="sub">Mississippi ${esc(cfg.label)} · ${pc(c.w)} of the state's vote</div>`;
  h += `<div class="kv"><span>Counted</span><b>${c.pct.toFixed(0)}% · ${fmtInt(c.votes)} of ~${fmtInt(c.votes + c.left)}</b></div>`;
  h += `<div class="cbar"><i style="width:${Math.min(100, c.pct).toFixed(1)}%"></i></div><div class="kv">`;
  if (c.share != null) {
    h += `<span>${esc(dn)}</span><b>${fmtInt(c.dv)} · ${pc(c.share)}</b><span>${esc(rn)}</span><b>${fmtInt(c.rv)} · ${pc(1 - c.share)}</b>`;
    h += `<span>Margin so far</span><b class="${cls(2 * c.share - 1)}">${lead(100 * (2 * c.share - 1), cfg)}</b>`;
  } else h += `<span>Votes</span><b>${c.votes ? "too few to read" : "not reporting yet"}</b>`;
  h += `<i class="gap"></i><span>Expected (our model)</span><b>${lead(100 * (2 * c.exp - 1), cfg)}</b>`;
  h += `<span>Tie statewide needs</span><b>${esc(dn)} ${pc(c.tie)}</b>`;
  if (c.dev != null) {
    h += `<span>Over/under</span><b class="${cls(c.dev)}">${Math.abs(c.dev) < 0.5 ? "as expected" : (c.dev > 0 ? esc(dn) : esc(rn)) + " +" + Math.abs(c.dev).toFixed(1) + " pts"}</b>`;
    h += `<span>Net vs expected</span><b class="${cls(c.net)}">${(c.net > 0 ? esc(dn) : esc(rn)) + " +" + fmtInt(Math.abs(c.net))} votes</b>`;
  }
  h += `<span>Votes left</span><b>~${fmtInt(c.left)}</b><i class="gap"></i>`;
  for (const [lab, m] of Object.entries(c.past)) h += `<span>${esc(lab)}</span><b class="${cls(m)}">${m > 0 ? "D" : "R"} +${Math.abs(m).toFixed(1)}</b>`;
  h += `<span>Turnout ${esc(cfg.turnout)}${c.nexp ? " / now (NYT)" : ""}</span><b>${fmtInt(c.vt)}${c.nexp ? " / " + fmtInt(c.nexp) : ""}</b></div>`;
  h += `<div class="fine">Shares are two-party. Expected: the county's lean (${esc(cfg.bases.join(" + "))}), shifted so the state lands on our model (${lead(cfg.model.d_margin, cfg)}).` +
    (c.share != null && c.pct < 95 ? " Part-counted: absentee and election-day batches can lean differently." : "") + `</div>`;
  return h;
}

function fill(c) {
  if (c.dev == null) return [34, 41, 52, 235];
  const t = Math.max(-1, Math.min(1, c.dev / OU_FULL)), k = Math.sqrt(Math.abs(t)), base = [64, 70, 84], tgt = t > 0 ? C_D : C_R;
  const a = Math.round(255 * Math.min(1, 0.45 + 0.55 * c.pct / 95));
  return [0, 1, 2].map(i => Math.round(base[i] + (tgt[i] - base[i]) * k)).concat([a]);
}
const metricOf = c => ui.metric === "left" ? c.left : ui.metric === "pts" ? c.dev : c.net;

function fit() {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const r of G.outline) for (const [x, y] of r) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const el = document.getElementById("deckmap"), w = x1 - x0, h = y1 - y0;
  const zoom = Math.log2(Math.min(el.clientWidth / (w * 1.1), el.clientHeight / (h * 1.35)));
  return { target: [(x0 + x1) / 2, (y0 + y1) / 2 + h * 0.04, 0], zoom, rotationX: 48, rotationOrbit: -12, size: Math.max(w, h) };
}

function centroid(r) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < r.length; i++) { const [x0, y0] = r[i], [x1, y1] = r[(i + 1) % r.length], f = x0 * y1 - x1 * y0; a += f; cx += (x0 + x1) * f; cy += (y0 + y1) * f; }
  return a ? [cx / (3 * a), cy / (3 * a)] : r[0];
}
const CENT = Object.fromEntries(Object.entries(G.counties).map(([f, rings]) => {
  const big = rings.reduce((m, r) => r.length > m.length ? r : m, rings[0]); return [f, centroid(big)];
}));

function layers(rs) {
  const cfg = B[ui.race], L = window.deck, polys = [];
  for (const c of rs) for (const ring of G.counties[c.f] || []) polys.push({ ring, c });
  const cols = rs.filter(c => { const v = metricOf(c); return v != null && (ui.metric === "left" ? v > 0 : c.votes > 0); });
  const max = Math.max(1e-9, ...cols.map(c => Math.abs(metricOf(c))));
  const H = FIT.size * 0.55, radius = FIT.size / 70;
  return [
    new L.PathLayer({ id: "nb", data: G.neighbours, getPath: d => d.concat([d[0]]), getColor: [70, 80, 96, 140], widthUnits: "pixels", getWidth: 1 }),
    new L.PolygonLayer({ id: "counties", data: polys, getPolygon: d => d.ring, pickable: true, stroked: true, filled: true,
      getFillColor: d => fill(d.c), getLineColor: d => d.c.f === ui.hl ? [240, 244, 250, 255] : [12, 16, 22, 255],
      lineWidthUnits: "pixels", getLineWidth: d => d.c.f === ui.hl ? 3 : 0.6,
      updateTriggers: { getFillColor: [fetchedAt, ui.race], getLineColor: [ui.hl], getLineWidth: [ui.hl] } }),
    new L.ColumnLayer({ id: "columns", data: cols, diskResolution: 14, radius, extruded: true, pickable: true,
      getPosition: c => CENT[c.f], getElevation: c => Math.abs(metricOf(c)) / max * H,
      getFillColor: c => ui.metric === "left" ? [200, 208, 220, 220] : (metricOf(c) >= 0 ? [...C_D, 240] : [...C_R, 240]),
      material: { ambient: 0.45, diffuse: 0.6, shininess: 24 },
      updateTriggers: { getElevation: [ui.metric, fetchedAt, ui.race, max], getFillColor: [ui.metric, fetchedAt, ui.race] },
      transitions: { getElevation: 350 } }),
  ];
}

const ageS = iso => iso ? Math.round((Date.now() - Date.parse(iso)) / 1000) : null;
const cents = p => p == null ? "–" : (Math.abs(100 * p - Math.round(100 * p)) > 0.05 ? (100 * p).toFixed(1) : (100 * p).toFixed(0)) + "¢";
const pctS = p => p == null ? "–" : (100 * p).toFixed(0) + "%";

function chartSvg(id, pts, series, yr, fmtY, band) {
  // pts: rows with .t; series: [{k, color, dash, label}]; yr: [lo, hi]; band: [loKey, hiKey] or null
  const W = 380, H = 130, l = 30, r = 6, t = 6, b = 18;
  const ts = pts.map(p => Date.parse(p.t)), t0 = ts[0], t1 = Math.max(ts[ts.length - 1], t0 + 60000);
  const X = v => l + (W - l - r) * (v - t0) / (t1 - t0), Y = v => t + (H - t - b) * (1 - (v - yr[0]) / (yr[1] - yr[0]));
  const mid = id === "wc" ? 50 : 0;
  let ticks = [0, 25, 50, 75, 100];
  if (id !== "wc") { const st = (yr[1] - yr[0]) > 24 ? 10 : 5; ticks = []; for (let v = Math.ceil(yr[0] / st) * st; v <= yr[1]; v += st) ticks.push(v); }
  let g = "";
  for (const v of ticks) g += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === mid ? "#46536a" : "#212a37"}" stroke-width="1"/><text x="${l - 4}" y="${Y(v) + 3}" text-anchor="end">${fmtY(v)}</text>`;
  const fmtT = v => new Date(v).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
  g += `<text x="${l}" y="${H - 4}">${fmtT(t0)}</text><text x="${W - r}" y="${H - 4}" text-anchor="end">${fmtT(t1)}</text>`;
  if (band) {
    const ok = pts.filter(p => p[band[0]] != null);
    if (ok.length > 1) g += `<path d="M${ok.map(p => X(Date.parse(p.t)) + "," + Y(Math.min(yr[1], p[band[1]]))).join("L")}L${ok.slice().reverse().map(p => X(Date.parse(p.t)) + "," + Y(Math.max(yr[0], p[band[0]]))).join("L")}Z" fill="rgba(74,144,232,.16)"/>`;
  }
  for (const s of series) {
    let d = "", pen = false;
    for (const p of pts) {
      const v = p[s.k];
      if (v == null) { pen = false; continue; }
      d += (pen ? "L" : "M") + X(Date.parse(p.t)).toFixed(1) + "," + Y(Math.max(yr[0], Math.min(yr[1], v))).toFixed(1); pen = true;
    }
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""}/>`;
  }
  g += `<line class="xh" x1="0" x2="0" y1="${t}" y2="${H - b}" stroke="#8e99aa" stroke-width="1" visibility="hidden"/>`;
  g += `<rect x="${l}" y="${t}" width="${W - l - r}" height="${H - t - b}" fill="transparent" data-chart="${id}" data-l="${l}" data-w="${W - l - r}" data-t0="${t0}" data-t1="${t1}"/>`;
  return `<svg class="wchart" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${id === "wc" ? "Win chance over time" : "Margin over time"}">${g}</svg>` +
    `<div class="clegend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.label}${s.dash ? " (dashed)" : ""}</span>`).join("")}` +
    `${band ? `<span><i style="background:rgba(74,144,232,.35);height:8px;vertical-align:0"></i>80% band</span>` : ""}</div>`;
}

function projHtml() {
  const j = LJ;
  if (!j) return `<div class="proj"><b>Projection & markets</b><span class="note">Waiting for the live job (live.json)…</span></div>`;
  const dn = last(j.d), rn = last(j.r), age = ageS(j.generated);
  const leadM = m => m == null ? "–" : Math.abs(m) < 0.05 ? "tied" : `${m > 0 ? dn : rn} +${Math.abs(m).toFixed(1)}`;
  let h = `<div class="proj"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Projection & markets</b>` +
    `<span class="note ${age > 120 ? "err" : ""}">${age == null ? "" : age > 120 ? "stale: " + Math.round(age / 60) + " min old" : "updated " + age + " s ago"}</span></div>`;
  if (j.flip && j.best) h += `<div class="flip">FLIP: buy ${j.best.side === "D" ? esc(dn) : esc(rn)} on ${j.best.venue === "kalshi" ? "Kalshi" : "Polymarket"} at ${cents(j.best.ask)} (our chance ${pctS(j.best.side === "D" ? j.v1.p : 1 - j.v1.p)})</div>`;
  if (j.v1) {
    const lo = j.v1.mu - 1.2816 * j.v1.sd, hi = j.v1.mu + 1.2816 * j.v1.sd;
    h += `<div class="big"><div><small>Our chance: ${esc(dn)}</small><b class="pos">${pctS(j.v1.p)}</b></div><div><small>${esc(rn)}</small><b class="neg">${pctS(1 - j.v1.p)}</b></div>` +
      `<div><small>Kalshi ${esc(dn)} (ask)</small><b style="color:${C_K}">${cents(j.kalshi && j.kalshi.D && j.kalshi.D.ask)}</b></div></div>`;
    h += `<div class="kv"><span>Projected final margin</span><b class="${cls(j.v1.mu)}">${leadM(j.v1.mu)}</b>` +
      `<span>80% band</span><b>${leadM(lo)} to ${leadM(hi)}</b>` +
      `<span>Counted votes alone point to</span><b class="${cls(j.implied && j.implied.mu)}">${j.implied ? leadM(j.implied.mu) + " ± " + j.implied.sd.toFixed(1) : "–"}</b>` +
      `<span>Our model before the count</span><b class="${cls(j.model.margin)}">${leadM(j.model.margin)} (± ${j.model.sd})</b>` +
      `<span>Votes still to count (est.)</span><b>${fmtInt(j.v1.remaining)}</b></div>`;
  } else h += `<span class="note">No count yet: the projector starts with the first votes.</span>`;
  h += `<table><thead><tr><th>Buy</th><th>Venue</th><th>Bid</th><th>Ask</th><th>Fee</th><th>Ours</th><th>Edge</th></tr></thead><tbody>`;
  for (const [vk, vn] of [["kalshi", "Kalshi"], ["polymarket", "Polymarket"]]) for (const side of ["D", "R"]) {
    const bk = (j[vk] || {})[side] || {}, tr = (j.trades || []).find(x => x.venue === vk && x.side === side);
    const ours = j.v1 ? (side === "D" ? j.v1.p : 1 - j.v1.p) : null;
    const isBest = j.best && j.best.venue === vk && j.best.side === side && j.best.edge > 0;
    h += `<tr class="${isBest ? "best" : ""}" title="${esc(bk.how || "")}${bk.ask_size ? " · " + fmtInt(bk.ask_size) + " contracts at the ask" : ""}">` +
      `<td class="${side === "D" ? "pos" : "neg"}">${esc(side === "D" ? dn : rn)}</td><td style="font-family:var(--sans)">${vn}</td>` +
      `<td>${cents(bk.bid)}</td><td>${cents(bk.ask)}</td><td>${tr ? cents(tr.fee) : "–"}</td><td>${pctS(ours)}</td>` +
      `<td class="${tr && tr.edge > 0 ? "pos" : ""}" style="${tr && tr.edge <= 0 ? "color:var(--faint)" : ""}">${tr ? (tr.edge >= 0 ? "+" : "−") + (100 * Math.abs(tr.edge)).toFixed(1) + "¢" : "–"}</td></tr>`;
  }
  h += `</tbody></table><p class="note" style="margin:0">Bid = the best price someone will pay for that side's YES. Ask = the cheapest way to buy that side (YES on it, or NO on the other; hover a row for which and how many). Fee = taker fee per contract. Ours = our projection's chance. Edge = ours − ask − fee, per $1 contract; the best positive edge is shaded. FLIP (the desk's rule): our chance 45%+, edge 5¢+, ask 40¢ or less, 20%+ counted.</p>`;
  const hs = (j.hist || []).filter(p => p.p != null || p.ka != null);
  if (hs.length > 1) {
    const pts = hs.map(p => ({ t: p.t, p: p.p != null ? 100 * p.p : null, ka: p.ka != null ? 100 * p.ka : null, pm: p.pm != null ? 100 * p.pm : null,
      mu: p.mu, imp: p.imp, m: p.m, lo: p.mu != null ? p.mu - 1.2816 * p.sd : null, hi: p.mu != null ? p.mu + 1.2816 * p.sd : null, pct: p.pct }));
    window.__PTS = pts;
    h += `<div class="ctitle">${esc(dn)}'s chance: our projection vs the market</div>` + chartSvg("wc", pts, [
      { k: "p", color: "#4a90e8", label: "Our projection" }, { k: "ka", color: C_K, label: "Kalshi ask" },
      { k: "pm", color: "#b48ae6", dash: "4 3", label: "Polymarket ask" }], [0, 100], v => v + "%", null);
    const vals = pts.flatMap(p => [p.lo, p.hi, p.m, p.imp]).filter(v => v != null);
    const lo = Math.max(-40, Math.floor(Math.min(-5, ...vals) / 5) * 5), hi = Math.min(40, Math.ceil(Math.max(5, ...vals) / 5) * 5);
    h += `<div class="ctitle">Margin, points (+ = ${esc(dn)} ahead): projected vs counted</div>` + chartSvg("mc", pts, [
      { k: "mu", color: "#4a90e8", label: "Projected final" }, { k: "imp", color: "#7fb3f0", dash: "2 3", label: "Counted votes alone point to" },
      { k: "m", color: "#c9d1dc", label: "Margin so far" }], [lo, hi], v => (v > 0 ? "+" : "") + v, ["lo", "hi"]);
  }
  if (j.errors && Object.keys(j.errors).length) h += `<p class="note err" style="margin:0">${esc(Object.values(j.errors).join(" · "))}</p>`;
  return h + `</div>`;
}

function renderSide(rs) {
  const cfg = B[ui.race], s = summary(ui.race, rs), st = s.st, dn = last(cfg.model.d), rn = last(cfg.model.r);
  const m = st && st.dv + st.rv ? 100 * (st.dv - st.rv) / st.tot : null;
  let h = `<h3>Mississippi ${esc(cfg.label)}: ${esc(cfg.model.d)} vs ${esc(cfg.model.r)}</h3>` + projHtml() + `<h4>The count vs our model</h4><div class="kv">`;
  h += `<span>Counted</span><b>${st ? st.eevp.toFixed(0) + "% · " + fmtInt(st.tot) + " votes" : "–"}</b>`;
  h += `<span>Margin now</span><b class="${cls(m)}">${lead(m, cfg)}</b>`;
  h += `<span>Our model (before the count)</span><b class="${cls(cfg.model.d_margin)}">${lead(cfg.model.d_margin, cfg)}</b>`;
  h += `<span>Counted counties point to</span><b class="${cls(s.implied)}">${lead(s.implied, cfg)}</b>`;
  h += `<span>Net vs expected (counted)</span><b class="${cls(s.net)}">${s.n ? (s.net >= 0 ? esc(dn) : esc(rn)) + " +" + fmtInt(Math.abs(s.net)) : "–"}</b>`;
  h += `<span>Counties reporting / finished</span><b>${s.n} / ${s.done} of ${rs.length}</b></div>`;
  h += `<p class="note" style="margin:0">"Point to": the one statewide swing that fits the counted counties best, applied to every county. Mississippi has no early voting, so the count is mostly election-day votes; watch Hinds (Jackson) and the Delta counties for the Democrat, DeSoto, Rankin and Madison for the Republican. A third candidate (Pinkins) takes some votes; shares here are Colom vs Hyde-Smith only.</p>`;
  const key = rs.slice().sort((a, b) => b.w - a.w).slice(0, KEY_N);
  const top = key.reduce((a, c) => a + c.w, 0);
  h += `<h4>Counties that matter</h4><p class="note" style="margin:0">The ${KEY_N} biggest hold ${(100 * top).toFixed(0)}% of the state's vote. + = ${esc(dn)} ahead of expectation. Hover a row to find it on the map.</p>`;
  h += `<table><thead><tr><th>County</th><th>Of state</th><th>Counted</th><th>Margin</th><th>Over/under</th><th>Net</th><th>Left</th></tr></thead><tbody>`;
  for (const c of key) {
    const mm = c.share != null ? 100 * (2 * c.share - 1) : null;
    h += `<tr data-f="${c.f}"><td>${esc(c.n)}</td><td>${(100 * c.w).toFixed(1)}%</td><td>${c.pct.toFixed(0)}%</td>` +
      `<td class="${cls(mm)}">${mm == null ? "–" : (mm > 0 ? "D+" : "R+") + Math.abs(mm).toFixed(1)}</td>` +
      `<td class="${c.dev == null ? "" : cls(c.dev)}">${c.dev == null ? "–" : (c.dev >= 0 ? "+" : "−") + Math.abs(c.dev).toFixed(1)}</td>` +
      `<td class="${c.net == null ? "" : cls(c.net)}">${c.net == null ? "–" : (c.net >= 0 ? "+" : "−") + fmtInt(Math.abs(c.net))}</td><td>${fmtInt(c.left)}</td></tr>`;
  }
  h += `</tbody></table><p class="note" style="margin:0">Separate from the data desk. Count: NYT, every 60 s. Model: the margin model's 2026 forecast. Projection: polling-agg's county projector (v1), run every 30 s in this repo's GitHub Actions job; its band runs wide early in the count.</p>`;
  document.getElementById("side").innerHTML = h;
}

function render(refit) {
  const cfg = B[ui.race], rs = rows(ui.race);
  document.getElementById("races").innerHTML = Object.entries(B).map(([k, v]) => `<button data-race="${k}" aria-pressed="${ui.race === k}">${esc(v.label)}</button>`).join("");
  document.getElementById("legend").innerHTML =
    `<span><i style="background:rgb(${C_R})"></i>${esc(last(cfg.model.r))} ahead of our model (${OU_FULL}+ pts)</span>` +
    `<span><i style="background:rgb(64,70,84)"></i>as expected</span><span><i style="background:rgb(${C_D})"></i>${esc(last(cfg.model.d))} ahead (${OU_FULL}+ pts)</span>` +
    `<span><i style="background:rgb(34,41,52)"></i>not reporting</span><span>Faded: under 95% counted · drag to rotate, scroll to zoom</span>`;
  renderSide(rs);
  if (!FIT || refit) FIT = fit();
  if (!DECK) {
    DECK = new window.deck.Deck({ parent: document.getElementById("deckmap"), views: new window.deck.OrbitView({ orbitAxis: "Z", fovy: 35 }),
      initialViewState: { ...FIT, minZoom: -3, maxZoom: 9 }, controller: true, layers: layers(rs),
      getTooltip: ({ object }) => object ? { html: `<div class="ctip">${tipHtml(object.c || object, cfg)}</div>`,
        style: { background: "#131922", color: "#e7ebf1", border: "1px solid #2f3a4a", borderRadius: "6px", padding: "9px 11px", width: "320px" } } : null });
  } else DECK.setProps({ layers: layers(rs), getTooltip: ({ object }) => object ? { html: `<div class="ctip">${tipHtml(object.c || object, cfg)}</div>`,
        style: { background: "#131922", color: "#e7ebf1", border: "1px solid #2f3a4a", borderRadius: "6px", padding: "9px 11px", width: "320px" } } : null });
  const lv = LIVE && LIVE[ui.race];
  document.getElementById("status").innerHTML = lastErr ? `<span class="err">${esc(lastErr)}</span>` :
    fetchedAt ? `checked <b>${etTime(fetchedAt)}</b>${lv && lv.updated ? " · NYT updated " + etTime(new Date(lv.updated)) : ""}` : "loading…";
}

async function refresh() {
  try {
    const r = await fetch(NYT + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("NYT " + r.status);
    LIVE = parse(await r.json()); fetchedAt = new Date(); lastErr = null;
  } catch (e) { lastErr = "Couldn't reach NYT (" + e.message + "), showing the last count"; }
  render(false);
}
document.getElementById("races").addEventListener("click", e => { const b = e.target.closest("button[data-race]"); if (b) { ui.race = b.dataset.race; render(false); } });
document.getElementById("metric").addEventListener("change", e => { ui.metric = e.target.value; render(false); });
document.getElementById("side").addEventListener("mouseover", e => { const t = e.target.closest("tr[data-f]"); if (t && ui.hl !== t.dataset.f) { ui.hl = t.dataset.f; render(false); } });
document.getElementById("side").addEventListener("mouseleave", () => { if (ui.hl) { ui.hl = null; render(false); } });
window.addEventListener("resize", () => { if (DECK) { FIT = fit(); DECK.setProps({ initialViewState: { ...FIT, minZoom: -3, maxZoom: 9 } }); } });
const genOf = j => j ? Date.parse(j.generated) || 0 : 0;
async function refreshLive() {
  let j = null;
  try { const r = await fetch(LJ_RAW + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) j = await r.json(); } catch (e) { /* the API next */ }
  if ((!j || Date.now() - genOf(j) > 90000) && Date.now() > ljApiOff && Date.now() - ljApiAt > 100000) {
    ljApiAt = Date.now();
    try {
      const r = await fetch(LJ_API, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-cache" });
      if (r.status === 403 || r.status === 429) ljApiOff = Date.now() + 600000;
      if (r.ok) { const a = await r.json(); if (!j || genOf(a) > genOf(j)) j = a; }
    } catch (e) { /* keep raw's copy */ }
  }
  if (j && genOf(j) >= genOf(LJ)) LJ = j;
  render(false);
}
// chart crosshair + tooltip
document.getElementById("side").addEventListener("mousemove", e => {
  const tip = document.getElementById("ctip"), rect = e.target.closest ? e.target.closest("rect[data-chart]") : null;
  document.querySelectorAll(".wchart .xh").forEach(x => x.setAttribute("visibility", "hidden"));
  if (!rect || !window.__PTS) { tip.hidden = true; return; }
  const svg = rect.ownerSVGElement, bb = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const xv = (e.clientX - bb.left) * vb.width / bb.width, l = +rect.dataset.l, w = +rect.dataset.w, t0 = +rect.dataset.t0, t1 = +rect.dataset.t1;
  const tv = t0 + (t1 - t0) * Math.max(0, Math.min(1, (xv - l) / w));
  let best = window.__PTS[0];
  for (const p of window.__PTS) if (Math.abs(Date.parse(p.t) - tv) < Math.abs(Date.parse(best.t) - tv)) best = p;
  const x = l + w * (Date.parse(best.t) - t0) / (t1 - t0), xh = svg.querySelector(".xh");
  xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.setAttribute("visibility", "visible");
  const dn = last(LJ.d), rn = last(LJ.r), f = v => v == null ? "–" : v.toFixed(0) + "%";
  const lm = m => m == null ? "–" : Math.abs(m) < 0.05 ? "tied" : `${m > 0 ? dn : rn} +${Math.abs(m).toFixed(1)}`;
  tip.innerHTML = `<b>${etTime(new Date(best.t))}</b> · ${best.pct == null ? "–" : best.pct.toFixed(0)}% counted<div class="kv" style="margin-top:4px">` +
    `<span>Our chance (${esc(dn)})</span><b class="pos">${f(best.p)}</b><span>Kalshi ask (${esc(dn)})</span><b style="color:${C_K}">${f(best.ka)}</b><span>Polymarket ask</span><b>${f(best.pm)}</b>` +
    `<span>Projected final</span><b>${lm(best.mu)}</b><span>80% band</span><b>${best.lo == null ? "–" : lm(best.lo) + " to " + lm(best.hi)}</b>` +
    `<span>Counted alone</span><b>${lm(best.imp)}</b><span>Margin so far</span><b>${lm(best.m)}</b></div>`;
  tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 305) + "px";
  tip.style.top = Math.min(e.clientY + 12, innerHeight - 200) + "px";
});
document.getElementById("side").addEventListener("mouseleave", () => { document.getElementById("ctip").hidden = true; });
refresh();
refreshLive();
setInterval(refresh, 60000);
setInterval(refreshLive, 30000);

</script>
</body>
</html>
